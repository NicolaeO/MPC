services:
  mpc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpc
    ports:
      - "8080:80"          # Access at http://localhost:8080
    restart: unless-stopped
    volumes:
      # Optional: serve posts live from your working copy.
      # Run `npm run generate-posts-index` after adding or editing a post.
      - ./public/posts:/usr/share/nginx/html/posts:ro
