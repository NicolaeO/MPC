# Served by the Docker image (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Missing posts must be a real 404 — the app relies on it to show "article not found".
    location /posts/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /jobs.json {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/articles, /post/…, /about) fall back to the SPA
    # so refreshing or opening a shared link works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
